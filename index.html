<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSE — She Knows What You Want</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050006;
    color: white;
    min-height: 100vh;
}

.hero {
    min-height: 100vh;
    background:
        linear-gradient(90deg, rgba(0,0,0,.75), rgba(0,0,0,.15)),
        url("background.jpg") center/cover no-repeat;
    display: flex;
    align-items: center;
    padding: 8%;
}

.content {
    max-width: 600px;
}

.logo {
    font-size: clamp(70px, 12vw, 150px);
    font-weight: 700;
    letter-spacing: 8px;
    text-shadow: 0 0 30px #c83cff;
}

.tagline {
    font-size: clamp(18px, 3vw, 28px);
    letter-spacing: 5px;
    margin: 10px 0 40px;
    color: #e8caff;
}

.description {
    color: #bbb;
    font-size: 18px;
    line-height: 1.7;
    max-width: 480px;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.button {
    display: inline-block;
    padding: 15px 25px;
    border: 1px solid #d15cff;
    border-radius: 5px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: .25s;
    background: rgba(80,0,100,.25);
}

.button:hover {
    background: #c83cff;
    box-shadow: 0 0 25px #c83cff;
    transform: translateY(-2px);
}

.ca {
    margin-top: 30px;
    color: #888;
    font-size: 13px;
}

@media(max-width:600px) {
    .hero {
        padding: 30px;
        background-position: 65% center;
    }

    .tagline {
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<section class="hero">
    <div class="content">

        <div class="logo">MUSE</div>

        <div class="tagline">
            SHE KNOWS WHAT YOU WANT.
        </div>

        <p class="description">
            The AI muse of the internet.
            Follow the signal. Enter the world of MUSE.
        </p>

        <div class="buttons">
            <a class="button" href="https://x.com/" target="_blank">𝕏 X</a>
            <a class="button" href="https://t.me/" target="_blank">Telegram</a>
            <a class="button" href="#" target="_blank">Pump.fun</a>
        </div>

        <div class="ca">
            $MUSE · CONTRACT: COMING SOON
        </div>

    </div>
</section>

</body>
</html>
